<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Registro - ArenaGaming</title>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-gray-100">
		<div class="flex items-center justify-center min-h-screen">
			<div class="w-full max-w-md p-6 bg-white rounded shadow">
				<h1 class="mb-4 text-2xl font-semibold text-center">Registro</h1>
				<form id="register-form" class="space-y-3">
					<input id="reg-name" type="text" placeholder="Nombre" required class="w-full p-2 border rounded" />
					<input id="reg-email" type="email" placeholder="Correo" required class="w-full p-2 border rounded" />
					<input id="reg-password" type="password" placeholder="Contraseña" required class="w-full p-2 border rounded" />
					<button class="w-full px-3 py-2 text-white bg-green-600 rounded">Registrar</button>
				</form>
				<p class="mt-4 text-sm text-center">¿Ya tienes cuenta? <a href="/login" class="text-blue-600">Inicia sesión</a></p>
			</div>
		</div>

		<script>
			const API_BASE = '/api';
			document.getElementById('register-form').onsubmit = async (e) => {
				e.preventDefault();
				const name = document.getElementById('reg-name').value;
				const email = document.getElementById('reg-email').value;
				const password = document.getElementById('reg-password').value;
				try {
					const res = await fetch(`${API_BASE}/auth/register`, {
						method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name, email, password})
					});
					if (!res.ok) throw new Error('register failed');
					alert('Registro exitoso. Ahora puedes iniciar sesión.');
					window.location.href = '/login';
				} catch (e) {
					alert('Error de registro');
				}
			};
		</script>
	</body>
</html>
